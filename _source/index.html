<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Architecture Use Cases</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.3);
      --accent: #38bdf8;
      --nav-bg: rgba(15, 23, 42, 0.85);
      --btn-bg: rgba(255, 255, 255, 0.08);
      --btn-hover: rgba(255, 255, 255, 0.15);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.08);
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #4f46e5;
      --primary-glow: rgba(79, 70, 229, 0.15);
      --accent: #0284c7;
      --nav-bg: rgba(255, 255, 255, 0.85);
      --btn-bg: rgba(0, 0, 0, 0.05);
      --btn-hover: rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; line-height: 1.6; }
    header { position: sticky; top: 0; z-index: 100; backdrop-filter: blur(16px); background: var(--nav-bg); border-bottom: 1px solid var(--card-border); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .logo-container { font-weight: 700; font-size: 1.15rem; letter-spacing: -0.02em; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .theme-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; background: var(--btn-bg); color: var(--text); border: 1px solid var(--card-border); cursor: pointer; font-size: 0.85rem; font-weight: 600; text-decoration: none; }
    .theme-toggle:hover { background: var(--btn-hover); transform: translateY(-1px); }
    
    main { max-width: 800px; width: 92%; margin: 40px auto 60px; flex: 1; }
    
    .list-container { display: flex; flex-direction: column; gap: 12px; }
    .article-card { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; text-decoration: none; color: var(--text); backdrop-filter: blur(12px); font-size: 1.05rem; font-weight: 600; }
    .article-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 10px 25px -5px var(--primary-glow); }
    .card-arrow { font-size: 1.2rem; color: var(--accent); margin-left: 16px; }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      Cloud Architecture Use Cases
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle theme">
        <span id="themeIcon">☀️</span>
        <span id="themeText">Light</span>
      </button>
    </div>
  </header>

  <main>
    <div class="list-container" id="articleList">
      <a href="fan-out-and-single-subscriber-pattern.html" class="article-card">
        <span>1. Fan-Out vs Single Subscriber</span>
        <span class="card-arrow">&rarr;</span>
      </a>
    </div>
  </main>

  <script>
    function getStoredTheme() {
      return localStorage.getItem('sop_theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('sop_theme', theme);
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'light') {
        icon.textContent = '🌙';
        text.textContent = 'Dark';
      } else {
        icon.textContent = '☀️';
        text.textContent = 'Light';
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      applyTheme(current === 'light' ? 'dark' : 'light');
    }

    applyTheme(getStoredTheme());
  </script>
</body>
</html>
